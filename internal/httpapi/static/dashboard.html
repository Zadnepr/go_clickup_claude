<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>go_claude_agent — панель управления</title>
<style>
  :root {
    --bg: #f5f6f8;
    --bg-elev: #ffffff;
    --bg-soft: #eef0f3;
    --border: #e2e5ea;
    --text: #1c2128;
    --text-dim: #5b6472;
    --text-faint: #8b93a1;
    --accent: #3b6fd6;
    --accent-soft: #e8eefc;
    --good: #2f9e6e;
    --good-soft: #e5f6ee;
    --warn: #c8862a;
    --warn-soft: #fbf1de;
    --bad: #d1543f;
    --bad-soft: #fcebe7;
    --muted: #8b93a1;
    --shadow: 0 1px 2px rgba(20, 24, 32, .04), 0 6px 16px rgba(20, 24, 32, .05);
    --radius: 14px;
    --radius-sm: 9px;
  }
  :root[data-theme="dark"] {
    --bg: #14161b;
    --bg-elev: #1b1e25;
    --bg-soft: #21252d;
    --border: #2b2f38;
    --text: #e7e9ee;
    --text-dim: #a3aab7;
    --text-faint: #6b7280;
    --accent: #6d94e8;
    --accent-soft: #22283a;
    --good: #4fbf8e;
    --good-soft: #17281f;
    --warn: #d9a24f;
    --warn-soft: #2c2415;
    --bad: #e2695a;
    --bad-soft: #2c1a18;
    --muted: #6b7280;
    --shadow: 0 1px 2px rgba(0, 0, 0, .2), 0 8px 20px rgba(0, 0, 0, .3);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161b;
      --bg-elev: #1b1e25;
      --bg-soft: #21252d;
      --border: #2b2f38;
      --text: #e7e9ee;
      --text-dim: #a3aab7;
      --text-faint: #6b7280;
      --accent: #6d94e8;
      --accent-soft: #22283a;
      --good: #4fbf8e;
      --good-soft: #17281f;
      --warn: #d9a24f;
      --warn-soft: #2c2415;
      --bad: #e2695a;
      --bad-soft: #2c1a18;
      --muted: #6b7280;
      --shadow: 0 1px 2px rgba(0, 0, 0, .2), 0 8px 20px rgba(0, 0, 0, .3);
    }
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 0 0 48px;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 24px;
    background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
  }
  .topbar h1 {
    font-size: 15px; font-weight: 600; margin: 0;
    display: flex; align-items: center; gap: 8px;
  }
  .topbar .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    background: var(--bg-soft); color: var(--text-dim);
    font-size: 12px; border: 1px solid var(--border);
  }
  .pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
  .pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
  .icon-btn {
    width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--bg-elev); color: var(--text-dim); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .icon-btn:hover { background: var(--bg-soft); color: var(--text); }

  main {
    max-width: 1120px; margin: 0 auto; padding: 20px 24px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .span2 { grid-column: 1 / -1; }

  .card {
    background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
  }
  .card h2 {
    margin: 0 0 14px; font-size: 13px; font-weight: 650; letter-spacing: .02em;
    text-transform: uppercase; color: var(--text-dim);
    display: flex; align-items: center; gap: 8px;
  }
  .card h2 .count { color: var(--text-faint); font-weight: 500; text-transform: none; letter-spacing: 0; }

  .kv-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 18px; }
  .kv {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; border-radius: var(--radius-sm); background: var(--bg-soft);
  }
  .kv .icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }
  .kv .label { color: var(--text-faint); font-size: 11.5px; display: block; }
  .kv .value { font-weight: 550; font-size: 13px; word-break: break-word; }
  .kv .value.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .kv.editable { align-items: stretch; flex-direction: column; gap: 2px; }
  .kv select.nice-select {
    appearance: none; -webkit-appearance: none;
    border: none; background: transparent; color: var(--text);
    font: inherit; font-weight: 550; font-size: 13px; padding: 1px 18px 1px 0; cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path fill='%238b93a1' d='M5.5 7.5l4.5 4.5 4.5-4.5z'/></svg>");
    background-repeat: no-repeat; background-position: right 0 center; background-size: 14px;
  }
  .kv select.nice-select:focus { outline: none; }
  .kv select.nice-select option { color: initial; background: var(--bg-elev); }

  .person { display: inline-flex; align-items: center; gap: 6px; }
  .avatar {
    width: 20px; height: 20px; border-radius: 50%; object-fit: cover;
    background: var(--bg-soft); border: 1px solid var(--border);
  }
  .avatar-fallback {
    width: 20px; height: 20px; border-radius: 50%; background: var(--accent-soft);
    color: var(--accent); font-size: 10px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }

  .task-row {
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 12px 14px; margin-bottom: 10px; background: var(--bg-soft);
  }
  .task-row:last-child { margin-bottom: 0; }
  .task-row .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .task-row .title { font-weight: 600; flex: 1; min-width: 120px; }
  .task-row .actions { display: flex; gap: 6px; }
  .btn {
    border: 1px solid var(--border); background: var(--bg-elev); color: var(--text);
    border-radius: 8px; padding: 6px 11px; font-size: 12.5px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px; font-weight: 550;
  }
  .btn:hover { background: var(--bg-soft); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, var(--border)); }
  .btn.warnish { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, var(--border)); }
  .btn.primary { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }

  .stages { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
  .stage-chip {
    font-size: 10.5px; padding: 3px 8px; border-radius: 999px;
    background: var(--bg-elev); border: 1px solid var(--border); color: var(--text-faint);
  }
  .stage-chip.done { background: var(--good-soft); color: var(--good); border-color: transparent; }
  .stage-chip.running { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .stage-chip.failed { background: var(--bad-soft); color: var(--bad); border-color: transparent; }

  .tokens-line {
    margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap;
    font-size: 12px; color: var(--text-dim);
  }
  .tokens-line b { color: var(--text); }

  .empty { color: var(--text-faint); font-size: 13px; padding: 6px 2px; }

  .queue-list { display: flex; flex-direction: column; gap: 6px; }
  .queue-item {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 10px; border-radius: var(--radius-sm); background: var(--bg-soft);
    font-size: 13px;
  }
  .queue-item .id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; flex: 1; min-width: 80px; }
  .queue-item .name { color: var(--text-dim); font-size: 12px; flex-basis: 100%; }

  .run-controls { display: flex; gap: 6px; align-items: center; }
  .run-controls select {
    border: 1px solid var(--border); background: var(--bg-elev); color: var(--text);
    border-radius: 7px; padding: 5px 7px; font-size: 12px; cursor: pointer;
  }
  .run-controls select.model-select { width: 128px; }
  .run-controls select.effort-select { width: 78px; }

  .assignees { display: flex; gap: 4px; margin-top: 2px; }

  .divider {
    border: none; border-top: 1px dashed var(--border); margin: 14px 0;
  }
  .section-label { font-size: 11px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .02em; margin-bottom: 8px; }

  .model-edit { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab {
    border: 1px solid var(--border); background: var(--bg-soft); color: var(--text-dim);
    padding: 5px 12px; border-radius: 999px; font-size: 12.5px; cursor: pointer; font-weight: 550;
  }
  .tab.active { background: var(--accent-soft); color: var(--accent); border-color: transparent; }

  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat-box { background: var(--bg-soft); border-radius: var(--radius-sm); padding: 12px; text-align: center; }
  .stat-box .num { font-size: 21px; font-weight: 700; }
  .stat-box .lbl { font-size: 11px; color: var(--text-faint); margin-top: 2px; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-faint); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .02em; }
  tr:last-child td { border-bottom: none; }
  td.mono, th.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .badge {
    display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 600;
  }
  .badge.pass { background: var(--good-soft); color: var(--good); }
  .badge.fail { background: var(--bad-soft); color: var(--bad); }
  .badge.blocked { background: var(--warn-soft); color: var(--warn); }
  .badge.done { background: var(--good-soft); color: var(--good); }
  .badge.running { background: var(--accent-soft); color: var(--accent); }
  .badge.queued { background: var(--bg-soft); color: var(--text-dim); }
  .badge.failed { background: var(--bad-soft); color: var(--bad); }
  .badge.paused { background: var(--warn-soft); color: var(--warn); }
  .badge.interrupted { background: var(--warn-soft); color: var(--warn); }

  .toast-wrap { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
  .toast {
    background: var(--bg-elev); border: 1px solid var(--border); box-shadow: var(--shadow);
    border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; max-width: 320px;
  }
  .toast.err { border-color: color-mix(in srgb, var(--bad) 40%, var(--border)); color: var(--bad); }
  .toast.ok { border-color: color-mix(in srgb, var(--good) 40%, var(--border)); color: var(--good); }

  details.session { border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 6px; background: var(--bg-soft); }
  details.session summary { padding: 8px 10px; cursor: pointer; font-size: 12.5px; display: flex; gap: 10px; align-items: center; list-style: none; }
  details.session summary::-webkit-details-marker { display: none; }
  details.session .body { padding: 0 12px 12px; }
  details.session pre {
    white-space: pre-wrap; word-break: break-word; background: var(--bg-elev);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-size: 11.5px;
    max-height: 320px; overflow: auto; margin: 6px 0 0;
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>🤖 go_claude_agent</h1>
  <span class="pill" id="queue-pause-pill" hidden>⏸️ очередь на паузе</span>
  <div class="spacer"></div>
  <span class="pill" id="refresh-pill">● обновлено только что</span>
  <button class="icon-btn" id="theme-toggle" title="Переключить тему">🌙</button>
</div>

<main>
  <section class="card span2" id="card-current">
    <h2>▶️ Текущая задача <span class="count" id="current-count"></span></h2>
    <div id="current-body"><div class="empty">Загрузка…</div></div>
  </section>

  <section class="card" id="card-queue">
    <h2>📋 Очередь <span class="count" id="queue-count"></span></h2>
    <div id="queue-body"><div class="empty">Загрузка…</div></div>
    <hr class="divider">
    <div class="section-label">Остальные задачи в колонке-триггере без тега <span id="other-tag-label"></span></div>
    <div id="other-body"><div class="empty">Загрузка…</div></div>
  </section>

  <section class="card" id="card-settings">
    <h2>⚙️ Настройки</h2>
    <div id="settings-body"><div class="empty">Загрузка…</div></div>
  </section>

  <section class="card span2" id="card-stats">
    <h2>📊 Статистика</h2>
    <div class="tabs" id="stats-tabs">
      <button class="tab" data-window="hour">Час</button>
      <button class="tab" data-window="day">День</button>
      <button class="tab active" data-window="all">Всё время</button>
    </div>
    <div id="stats-body"><div class="empty">Загрузка…</div></div>
  </section>

  <section class="card span2" id="card-sessions">
    <h2>🪙 Токены по сессиям <span class="count" id="sessions-count"></span></h2>
    <div class="tabs" id="sessions-tabs">
      <button class="tab" data-window="hour">Час</button>
      <button class="tab" data-window="day">День</button>
      <button class="tab active" data-window="all">Всё время</button>
    </div>
    <div id="sessions-body"><div class="empty">Загрузка…</div></div>
  </section>
</main>

<div class="toast-wrap" id="toast-wrap"></div>

<script>
"use strict";

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

// ---------- тема ----------
const themeToggle = $("#theme-toggle");
function applyTheme(t) {
  if (t) document.documentElement.setAttribute("data-theme", t);
  else document.documentElement.removeAttribute("data-theme");
  themeToggle.textContent = (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) ? "☀️" : "🌙";
}
let savedTheme = null;
try { savedTheme = localStorage.getItem("dashboard-theme"); } catch (e) {}
applyTheme(savedTheme);
themeToggle.addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme") ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = current === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("dashboard-theme", next); } catch (e) {}
});

// ---------- утилиты ----------
function toast(msg, kind) {
  const wrap = $("#toast-wrap");
  const el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error(`${res.status} ${text || res.statusText}`);
  }
  const ct = res.headers.get("content-type") || "";
  return ct.includes("application/json") ? res.json() : res.text();
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtNum(n) { return (n ?? 0).toLocaleString("ru-RU"); }
function fmtCost(n) { return "$" + (n ?? 0).toFixed(4); }
function fmtDur(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return d.toLocaleString("ru-RU", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit"});
}
function initials(name) {
  if (!name) return "?";
  return name.split(/\s+/).slice(0,2).map(w => w[0]).join("").toUpperCase();
}
function personHTML(m) {
  if (!m) return '<span class="value">—</span>';
  const label = esc(m.username || ("ID " + m.id));
  if (m.avatar) {
    return `<span class="person"><img class="avatar" src="${esc(m.avatar)}" alt=""><span class="value">${label}</span></span>`;
  }
  return `<span class="person"><span class="avatar-fallback">${esc(initials(m.username || String(m.id)))}</span><span class="value">${label}</span></span>`;
}

// ---------- настройки ----------
const EFFORT_OPTIONS = ["low", "medium", "high", "xhigh", "max"];
function effortOptionsHTML(selected) {
  return '<option value="">(по умолчанию)</option>' + EFFORT_OPTIONS.map(e =>
    `<option value="${e}"${e === selected ? " selected" : ""}>${e}</option>`).join("");
}

// Модели claude, доступные через --model (см. Runner.SetModelEffort и
// review.CallOptions): алиас "последняя версия" каждого семейства плюс
// конкретная закреплённая версия — не полный исторический архив, а то, что
// точно валидно принять этому CLI прямо сейчас.
const MODEL_GROUPS = [
  { label: "Sonnet", options: [
    { value: "sonnet", label: "Sonnet (последняя)" },
    { value: "claude-sonnet-5", label: "Sonnet 5" },
  ]},
  { label: "Opus", options: [
    { value: "opus", label: "Opus (последняя)" },
    { value: "claude-opus-5", label: "Opus 5" },
  ]},
  { label: "Haiku", options: [
    { value: "haiku", label: "Haiku (последняя)" },
    { value: "claude-haiku-4-5-20251001", label: "Haiku 4.5" },
  ]},
];
// withDefaultOption — если true, добавляет пустой пункт "(по умолчанию)"
// первым (для выбора модели на один ручной запуск — пусто значит "текущее
// значение по умолчанию", см. runControlsHTML); настройки самого дефолта
// (loadSettings) его не используют — там модель всегда обязана быть задана.
function modelOptionsHTML(selected, withDefaultOption) {
  const known = MODEL_GROUPS.some(g => g.options.some(o => o.value === selected));
  const custom = (selected && !known) ? `<option value="${esc(selected)}" selected>${esc(selected)}</option>` : "";
  const defaultOpt = withDefaultOption ? `<option value=""${selected === "" ? " selected" : ""}>(по умолчанию)</option>` : "";
  return defaultOpt + custom + MODEL_GROUPS.map(g =>
    `<optgroup label="${g.label}">` +
    g.options.map(o => `<option value="${o.value}"${o.value === selected ? " selected" : ""}>${esc(o.label)}</option>`).join("") +
    `</optgroup>`
  ).join("");
}

function avatarsHTML(assignees) {
  if (!assignees || !assignees.length) return "";
  return '<div class="assignees">' + assignees.map(m => {
    if (m.avatar) return `<img class="avatar" title="${esc(m.username || ('ID ' + m.id))}" src="${esc(m.avatar)}" alt="">`;
    return `<span class="avatar-fallback" title="${esc(m.username || ('ID ' + m.id))}">${esc(initials(m.username || String(m.id)))}</span>`;
  }).join("") + "</div>";
}

async function loadSettings() {
  const body = $("#settings-body");
  try {
    const c = await api("/api/config");
    body.innerHTML = `
      <div class="kv-grid">
        <div class="kv"><span class="icon">🏷️</span><span><span class="label">Тег-триггер</span><span class="value mono">${esc(c.trigger_tag)}</span></span></div>
        <div class="kv"><span class="icon">📥</span><span><span class="label">Колонка-триггер</span><span class="value">${esc(c.status_trigger)}</span></span></div>
        <div class="kv"><span class="icon">⏳</span><span><span class="label">Колонка проверки</span><span class="value">${esc(c.status_running)}</span></span></div>
        <div class="kv"><span class="icon">✅</span><span><span class="label">Колонка при pass</span><span class="value">${esc(c.status_pass || "—")}</span></span></div>
        <div class="kv"><span class="icon">❌</span><span><span class="label">Колонка при fail</span><span class="value">${esc(c.status_fail || "—")}</span></span></div>
        <div class="kv"><span class="icon">👤</span><span><span class="label">ASSIGNEE_ON_FAIL</span>${personHTML(c.assignee_on_fail)}</span></div>
        <div class="kv"><span class="icon">👤</span><span><span class="label">ASSIGNEE_ON_PASS</span>${personHTML(c.assignee_on_pass)}</span></div>
        <div class="kv"><span class="icon">🧵</span><span><span class="label">Воркеров</span><span class="value">${esc(c.worker_concurrency)}</span></span></div>
        <div class="kv"><span class="icon">⏱️</span><span><span class="label">Таймаут прогона</span><span class="value">${esc(c.review_timeout)}</span></span></div>
        <div class="kv"><span class="icon">🔁</span><span><span class="label">Интервал сверки</span><span class="value">${esc(c.reconcile_interval)}</span></span></div>
        <div class="kv"><span class="icon">🚦</span><span><span class="label">Пауза при лимите</span><span class="value">${esc(c.usage_limit_pause)}</span></span></div>
        <div class="kv"><span class="icon">🎯</span><span><span class="label">ClickUp List ID</span><span class="value mono">${esc(c.cu_list_id)}</span></span></div>
        <div class="kv"><span class="icon">📁</span><span><span class="label">Репозиторий</span><span class="value mono">${esc(c.repo_path)}</span></span></div>
        <div class="kv"><span class="icon">🔔</span><span><span class="label">Вебхук</span><span class="value">${c.webhook_enabled ? "включён" : "выключен (только сверка)"}</span></span></div>
        <div class="kv editable"><span class="icon">🤖</span><span><span class="label">Модель claude</span>
          <select id="model-select" class="nice-select">${modelOptionsHTML(c.claude_model)}</select>
        </span></div>
        <div class="kv editable"><span class="icon">⚡</span><span><span class="label">Effort</span>
          <select id="effort-select" class="nice-select">${effortOptionsHTML(c.claude_effort)}</select>
        </span></div>
      </div>
      <div class="model-edit" style="margin-top:12px;">
        <button class="btn primary" id="model-save-btn">💾 Сохранить модель/effort</button>
        <span id="model-save-status" class="empty" style="padding:0"></span>
      </div>`;

    $("#model-save-btn").addEventListener("click", async () => {
      const btn = $("#model-save-btn");
      const status = $("#model-save-status");
      const model = $("#model-select").value;
      const effort = $("#effort-select").value;
      if (!model) { toast("Модель не может быть пустой", "err"); return; }
      btn.disabled = true;
      status.textContent = "сохраняю…";
      try {
        await api("/api/config/model", {
          method: "PUT", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({model, effort}),
        });
        status.textContent = "применено ✓";
        toast(`Модель по умолчанию: ${model}${effort ? "/" + effort : ""}`, "ok");
      } catch (e) {
        status.textContent = "";
        toast(`Не удалось сохранить: ${e.message}`, "err");
      } finally {
        btn.disabled = false;
      }
    });
  } catch (e) {
    body.innerHTML = `<div class="empty">Не удалось загрузить настройки: ${esc(e.message)}</div>`;
  }
}

// ---------- текущая задача + очередь ----------
const STAGE_LABELS = {
  setup: "старт", commands_check: "команды", git_fetch: "git", spec: "/spec",
  review: "/review", decide: "решение", comment: "комментарий",
};

function stagesHTML(stages) {
  if (!stages || !stages.length) return "";
  return '<div class="stages">' + stages.map(s =>
    `<span class="stage-chip ${esc(s.Status || s.status)}">${esc(STAGE_LABELS[s.Stage || s.stage] || s.Stage || s.stage)}</span>`
  ).join("") + "</div>";
}

async function taskAction(taskId, action, btn) {
  if (btn) btn.disabled = true;
  try {
    await api(`/api/tasks/${encodeURIComponent(taskId)}/${action}`, { method: "POST" });
    toast(`Команда «${action}» отправлена для ${taskId}`, "ok");
    await Promise.all([loadQueue(), loadStats(), loadSessions()]);
  } catch (e) {
    toast(`Не удалось выполнить «${action}»: ${e.message}`, "err");
  } finally {
    if (btn) btn.disabled = false;
  }
}

// runControlsHTML — модель/effort для одного ручного запуска (см.
// Требование «выбрать модель для текущей задачи»): пусто — использовать
// текущее значение по умолчанию, никак его не меняя.
function runControlsHTML() {
  return `
    <span class="run-controls">
      <select class="model-select">${modelOptionsHTML("", true)}</select>
      <select class="effort-select">${effortOptionsHTML("")}</select>
    </span>`;
}

async function runTask(taskId, row, btn) {
  const model = $(".model-select", row) ? $(".model-select", row).value : "";
  const effort = $(".effort-select", row) ? $(".effort-select", row).value : "";
  btn.disabled = true;
  try {
    await api("/api/run", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({task_id: taskId, model, effort}),
    });
    toast(`Запуск ${taskId} отправлен${model ? ` (${model}${effort ? "/" + effort : ""})` : ""}`, "ok");
    loadQueue();
  } catch (e) {
    toast(`Не удалось запустить: ${e.message}`, "err");
    btn.disabled = false;
  }
}

async function loadQueue() {
  const curCount = $("#current-count");
  const curBody = $("#current-body");
  const qCount = $("#queue-count");
  const qBody = $("#queue-body");
  const otherBody = $("#other-body");
  try {
    const data = await api("/api/queue");
    const active = data.active || [];
    const pending = data.pending || [];
    const otherToCheck = data.other_to_check || [];

    curCount.textContent = active.length ? `(${active.length})` : "";
    if (!active.length) {
      curBody.innerHTML = '<div class="empty">Сейчас ничего не проверяется</div>';
    } else {
      curBody.innerHTML = active.map(a => {
        const title = a.task_url
          ? `<a href="${esc(a.task_url)}" target="_blank" rel="noopener">${esc(a.task_name || a.task_id)}</a>`
          : esc(a.task_name || a.task_id);
        return `
        <div class="task-row" data-task="${esc(a.task_id)}">
          <div class="head">
            <span class="title">${title}</span>
            <span class="badge ${esc(a.status)}">${esc(a.status)}</span>
            <div class="actions">
              <button class="btn warnish" data-act="pause">⏸️ Пауза</button>
              <button class="btn danger" data-act="cancel">⏹️ Прервать</button>
            </div>
          </div>
          ${stagesHTML(a.stages)}
          <div class="tokens-line">
            <span>вход: <b>${fmtNum(a.input_tokens)}</b></span>
            <span>выход: <b>${fmtNum(a.output_tokens)}</b></span>
            <span>стоимость: <b>${fmtCost(a.cost_usd)}</b></span>
            <span>run #${esc(a.run_id)}</span>
          </div>
        </div>`;
      }).join("");

      $$(".task-row", curBody).forEach(row => {
        const taskId = row.dataset.task;
        $$(".actions button", row).forEach(btn => {
          btn.addEventListener("click", () => taskAction(taskId, btn.dataset.act, btn));
        });
      });
    }

    qCount.textContent = pending.length ? `(${pending.length})` : "";
    if (!pending.length) {
      qBody.innerHTML = '<div class="empty">Очередь пуста</div>';
    } else {
      qBody.innerHTML = '<div class="queue-list">' + pending.map(id => `
        <div class="queue-item" data-task="${esc(id)}">
          <span class="id">${esc(id)}</span>
          ${runControlsHTML()}
          <button class="btn primary" data-act="run">▶️ Запустить сейчас</button>
        </div>`).join("") + "</div>";
      $$(".queue-item", qBody).forEach(row => {
        const taskId = row.dataset.task;
        $(".btn", row).addEventListener("click", (ev) => runTask(taskId, row, ev.currentTarget));
      });
    }

    $("#other-tag-label").textContent = otherToCheck.length ? `(${otherToCheck.length})` : "";
    if (!otherToCheck.length) {
      otherBody.innerHTML = '<div class="empty">Таких задач нет</div>';
    } else {
      otherBody.innerHTML = '<div class="queue-list">' + otherToCheck.map(t => `
        <div class="queue-item" data-task="${esc(t.task_id)}">
          <span class="id">${esc(t.custom_id || t.task_id)}</span>
          ${avatarsHTML(t.assignees)}
          <span class="name">${esc(t.name)}</span>
          ${runControlsHTML()}
          <button class="btn primary" data-act="run">▶️ Запустить проверку</button>
        </div>`).join("") + "</div>";
      $$(".queue-item", otherBody).forEach(row => {
        const taskId = row.dataset.task;
        $(".btn", row).addEventListener("click", (ev) => runTask(taskId, row, ev.currentTarget));
      });
    }
  } catch (e) {
    curBody.innerHTML = `<div class="empty">Не удалось загрузить: ${esc(e.message)}</div>`;
    qBody.innerHTML = "";
    otherBody.innerHTML = "";
  }
}

// ---------- статистика ----------
let statsWindow = "all";
function verdictBadge(v) {
  if (!v) return "";
  return `<span class="badge ${esc(v)}">${esc(v)}</span>`;
}

async function loadStats() {
  const body = $("#stats-body");
  try {
    const s = await api(`/api/stats?window=${encodeURIComponent(statsWindow)}`);
    const byStatus = s.by_status || {};
    const byVerdict = s.by_verdict || {};
    const rows = (s.runs || []).slice(0, 25);

    const statusChips = Object.keys(byStatus).length
      ? Object.entries(byStatus).map(([k,v]) => `<span class="pill">${esc(k)}: <b>${fmtNum(v)}</b></span>`).join(" ")
      : '<span class="empty">нет данных</span>';
    const verdictChips = Object.keys(byVerdict).length
      ? Object.entries(byVerdict).map(([k,v]) => `<span class="pill">${esc(k)}: <b>${fmtNum(v)}</b></span>`).join(" ")
      : "";

    body.innerHTML = `
      <div class="stat-grid">
        <div class="stat-box"><div class="num">${fmtNum(s.total_runs)}</div><div class="lbl">прогонов</div></div>
        <div class="stat-box"><div class="num">${fmtNum(s.tokens && s.tokens.InputTokens)}</div><div class="lbl">токенов на вход</div></div>
        <div class="stat-box"><div class="num">${fmtNum(s.tokens && s.tokens.OutputTokens)}</div><div class="lbl">токенов на выход</div></div>
        <div class="stat-box"><div class="num">${fmtCost(s.tokens && s.tokens.CostUSD)}</div><div class="lbl">стоимость</div></div>
      </div>
      <div style="margin-bottom:12px; display:flex; gap:16px; flex-wrap:wrap;">
        <div>${statusChips}</div>
        <div>${verdictChips}</div>
      </div>
      <div style="overflow-x:auto;">
      <table>
        <thead><tr><th>#</th><th>Задача</th><th>Статус</th><th>Вердикт</th><th>Токены</th><th>Стоимость</th><th>Начало</th></tr></thead>
        <tbody>
          ${rows.length ? rows.map(r => `
            <tr>
              <td class="mono">${esc(r.ID)}</td>
              <td class="mono" title="${esc(r.TaskID)}">${esc(r.CustomID || r.TaskID)}</td>
              <td><span class="badge ${esc(r.Status)}">${esc(r.Status)}</span></td>
              <td>${verdictBadge(r.Verdict)}</td>
              <td>${fmtNum(r.InputTokens)} / ${fmtNum(r.OutputTokens)}</td>
              <td>${fmtCost(r.CostUSD)}</td>
              <td>${fmtDur(r.StartedAt)}</td>
            </tr>`).join("") : '<tr><td colspan="7" class="empty">Нет прогонов за этот период</td></tr>'}
        </tbody>
      </table>
      </div>`;
  } catch (e) {
    body.innerHTML = `<div class="empty">Не удалось загрузить статистику: ${esc(e.message)}</div>`;
  }
}

$$("#stats-tabs .tab").forEach(tab => {
  tab.addEventListener("click", () => {
    $$("#stats-tabs .tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    statsWindow = tab.dataset.window;
    loadStats();
  });
});

// ---------- токены по сессиям ----------
let sessionsWindow = "all";

async function loadSessions() {
  const body = $("#sessions-body");
  const count = $("#sessions-count");
  try {
    const s = await api(`/api/invocations?window=${encodeURIComponent(sessionsWindow)}`);
    const list = (s.invocations || []).slice().reverse().slice(0, 50);
    count.textContent = s.totals ? `(${fmtNum(s.totals.count)})` : "";

    if (!list.length) {
      body.innerHTML = '<div class="empty">Сессий за этот период нет</div>';
      return;
    }

    const totals = s.totals || {};
    body.innerHTML = `
      <div class="stat-grid">
        <div class="stat-box"><div class="num">${fmtNum(totals.count)}</div><div class="lbl">вызовов claude</div></div>
        <div class="stat-box"><div class="num">${fmtNum(totals.input_tokens)}</div><div class="lbl">токенов на вход</div></div>
        <div class="stat-box"><div class="num">${fmtNum(totals.output_tokens)}</div><div class="lbl">токенов на выход</div></div>
        <div class="stat-box"><div class="num">${fmtCost(totals.cost_usd)}</div><div class="lbl">стоимость</div></div>
      </div>
      <div id="sessions-list"></div>`;

    const listEl = $("#sessions-list");
    listEl.innerHTML = list.map(inv => `
      <details class="session">
        <summary>
          <span class="badge ${inv.is_error ? "fail" : "pass"}">${inv.is_error ? "ошибка" : "ok"}</span>
          <b>${esc(inv.stage)}</b>
          <span style="color:var(--text-faint)">run #${esc(inv.run_id)} · ${esc(inv.model || "—")}/${esc(inv.effort || "—")}</span>
          <span style="margin-left:auto; color:var(--text-dim)">${fmtNum(inv.input_tokens)} / ${fmtNum(inv.output_tokens)} · ${fmtCost(inv.cost_usd)}</span>
          <span style="color:var(--text-faint)">${fmtDur(inv.started_at)}</span>
        </summary>
        <div class="body">
          <div class="empty" style="padding:0 0 4px;">session_id: <span class="mono">${esc(inv.session_id || "—")}</span></div>
          <pre>${esc((inv.output || "").slice(0, 4000))}${(inv.output||"").length > 4000 ? "\\n…(обрезано)" : ""}</pre>
        </div>
      </details>
    `).join("");
  } catch (e) {
    body.innerHTML = `<div class="empty">Не удалось загрузить сессии: ${esc(e.message)}</div>`;
  }
}

$$("#sessions-tabs .tab").forEach(tab => {
  tab.addEventListener("click", () => {
    $$("#sessions-tabs .tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    sessionsWindow = tab.dataset.window;
    loadSessions();
  });
});

// ---------- обновление ----------
let lastRefresh = Date.now();
function touchRefreshPill() {
  lastRefresh = Date.now();
}
setInterval(() => {
  const sec = Math.round((Date.now() - lastRefresh) / 1000);
  $("#refresh-pill").textContent = sec < 2 ? "● обновлено только что" : `обновлено ${sec}с назад`;
}, 1000);

async function refreshFast() {
  await loadQueue();
  touchRefreshPill();
}
async function refreshAll() {
  await Promise.all([loadSettings(), loadQueue(), loadStats(), loadSessions()]);
  touchRefreshPill();
}

refreshAll();
setInterval(refreshFast, 5000);
setInterval(refreshAll, 60000);
</script>
</body>
</html>
