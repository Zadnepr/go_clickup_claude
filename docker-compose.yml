services:
  reviewer:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    # По умолчанию Docker ждёт остановки контейнера всего 10 секунд и потом
    # шлёт SIGKILL — а сервис по требованиям graceful shutdown должен
    # дождаться завершения ТЕКУЩЕГО прогона ревью (до REVIEW_TIMEOUT, по
    # умолчанию 15 минут). Без этого любой `docker compose up -d`/restart,
    # попавший на активный прогон, обрывает его SIGKILL'ом посреди работы.
    # Если меняете REVIEW_TIMEOUT — увеличьте и это значение (с запасом).
    stop_grace_period: 16m
    environment:
      # Значения не перечислены — подтягиваются из .env (docker compose
      # делает это автоматически для переменных без значения).
      - CLAUDE_CODE_OAUTH_TOKEN
      - CU_API_TOKEN
      - CU_TEAM_ID
      - CU_LIST_ID
      - CU_WEBHOOK_SECRET
      - SLACK_WEBHOOK_URL
      - REPO_PATH
      - REPO_URL
      - TRIGGER_TAG
      - STATUS_TRIGGER
      - STATUS_RUNNING
      - STATUS_PASS
      - STATUS_FAIL
      - ASSIGNEE_ON_FAIL
      - ASSIGNEE_ON_PASS
      - WORKER_CONCURRENCY
      - REVIEW_TIMEOUT
      - RECONCILE_INTERVAL
      - PORT
      - DB_PATH
      # SSH-агент хоста форвардится в контейнер (см. volumes ниже) — git
      # внутри контейнера аутентифицируется теми же ключами, что и на хосте,
      # сами приватные ключи в контейнер не копируются.
      - SSH_AUTH_SOCK=/ssh-agent
    volumes:
      - reviewer-data:/data
      # Рабочая копия репозитория: если REPO_URL не задан, смонтируйте свою
      # локальную копию с хоста вместо именованного тома, например:
      #   - /path/to/your/repo:/repo
      - ../:/repo
      # Проброс SSH-агента хоста (нужен для git fetch по SSH-remote'ам —
      # почти все репозитории perfectpanel используют git@github.com:...).
      # На macOS с Docker Desktop переменная SSH_AUTH_SOCK обычно уже
      # экспортирована в шелле — просто запускайте `docker compose up`
      # из обычного терминала. Проверить, что агент видит нужный ключ:
      # `ssh-add -l`. Приватные ключи в контейнер не копируются.
      - ${SSH_AUTH_SOCK}:/ssh-agent
      # ~/.ssh/config — нужен, если у вас настроены алиасы хостов
      # (например, github-personal для второго GitHub-аккаунта). Алиасы
      # с `IdentitiesOnly yes` и конкретным IdentityFile работать не будут —
      # приватный ключ форвардится только через агент, файла на диске нет.
      # Прогон это не остановит (успеха хотя бы одного репозитория достаточно),
      # но конкретно такой репозиторий не обновится.
      - ~/.ssh/config:/home/node/.ssh/config:ro
      - ~/.ssh/known_hosts:/home/node/.ssh/known_hosts:ro
      # Deploy key для git clone внутри контейнера при заданном REPO_URL:
      # раскомментируйте и укажите путь к приватному ключу на хосте.
      # - ./deploy_key:/home/node/.ssh/id_ed25519:ro
      # notion-cli — внутренний клиент приватного Notion API, не публичный
      # npm-пакет. Код с уже установленными зависимостями монтируется
      # как есть (без обёртки — та уже в образе, см. Dockerfile). Конфиг
      # содержит сохранённую сессию/токен — тот же принцип, что и SSH-агент:
      # используются реальные креды хоста, ничего не копируется в образ.
      - ../cli/notion-private-api-mcp:/opt/notion-cli:ro
      - ../.claude/specs:/home/node/.claude/specs:ro
      - ~/.config/notion-cli:/home/node/.config/notion-cli:ro
      - ~/.cache/notion-cli:/home/node/.cache/notion-cli

volumes:
  reviewer-data:
  reviewer-repo:
